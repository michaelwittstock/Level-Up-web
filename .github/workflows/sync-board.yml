name: Sync build board from Notion

# Rewrites docs/BOARD.md from the Notion "🛠️ Level Up Build Board" every hour.
# Needs the repo secret NOTION_TOKEN (see docs/WIKI.md > Turning on the board sync).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull board from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::NOTION_TOKEN secret is not set yet. Add it: Settings > Secrets and variables > Actions > New repository secret."
            exit 0
          fi
          node scripts/sync-board.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/BOARD.md; then echo "No board changes"; exit 0; fi
          git config user.name "level-up-board-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/BOARD.md
          git commit -m "Board sync from Notion"
          git pull --rebase
          git push
